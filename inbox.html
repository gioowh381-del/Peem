<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำถามสำคัญ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: #121216;
            --border-color: #27272a;
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.25);
            --secondary: #ff0055;
            --accent: #a855f7;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 240, 255, 0.05);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
        }

        .badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .sub-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background: #18181b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #1f1f24;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        /* สีไฮไลต์เฉพาะปุ่ม */
        .option-btn[data-choice="ได้"]:hover {
            border-color: #10b981;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25);
        }
        .option-btn[data-choice="ได้"] .dot { background: #10b981; }

        .option-btn[data-choice="ไม่เอาา"]:hover {
            border-color: #f43f5e;
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.25);
        }
        .option-btn[data-choice="ไม่เอาา"] .dot { background: #f43f5e; }

        .option-btn[data-choice="มาาา"]:hover {
            border-color: #00f0ff;
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.25);
        }
        .option-btn[data-choice="มาาา"] .dot { background: #00f0ff; }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* หน้าโหลดและหน้าสำเร็จ */
        .status-box {
            display: none;
            text-align: center;
            padding: 20px 0;
            animation: fadeIn 0.4s ease forwards;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(0, 240, 255, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .success-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .chosen-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: #18181b;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--primary);
            font-weight: 600;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนของคำถาม -->
        <div id="quizSection">
            <span class="badge">QUESTION</span>
            
            <!-- ✏️ แก้ไขข้อความคำถามตรงบรรทัดด้านล่างนี้ได้เลย -->
            <h1 class="question-text" id="questionTitle">ขอเย็ดหีหน่อยได้มั้ยย</h1>
            
            <p class="sub-text">เลือกคำตอบด้านล่างเพื่อส่งคำตอบ</p>

            <div class="options-group">
                <button type="button" class="option-btn" data-choice="ได้" onclick="submitAnswer('ได้')">
                    <span>ได้</span>
                    <span class="dot"></span>
                </button>

                <button type="button" class="option-btn" data-choice="ไม่เอาา" onclick="submitAnswer('ไม่เอาา')">
                    <span>ไม่เอาา</span>
                    <span class="dot"></span>
                </button>

                <button type="button" class="option-btn" data-choice="มาาา" onclick="submitAnswer('มาาา')">
                    <span>มาาา</span>
                    <span class="dot"></span>
                </button>
            </div>
        </div>

        <!-- ส่วนกำลังส่งข้อมูล -->
        <div id="loadingSection" class="status-box">
            <div class="spinner"></div>
            <h2 style="font-size: 1.2rem; margin-bottom: 6px;">กำลังส่งคำตอบ...</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">รอแป๊บเดียว</p>
        </div>

        <!-- ส่วนส่งสำเร็จ -->
        <div id="successSection" class="status-box">
            <div class="success-circle">✓</div>
            <h2 style="font-size: 1.35rem; margin-bottom: 6px;">ส่งคำตอบเรียบร้อย!</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted);">บันทึกคำตอบเข้าระบบแล้ว</p>
            <div class="chosen-badge" id="chosenText">คำตอบ: -</div>
        </div>
    </div>

    <script>
        const FORMSPREE_URL = "https://formspree.io/f/mqpqpjez";

        // ระบบเสียงสังเคราะห์ (Web Audio API) ไม่ต้องใช้ไฟล์เสียงแยก
        function playClickSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        async function submitAnswer(answer) {
            playClickSound('click');

            const quizSection = document.getElementById('quizSection');
            const loadingSection = document.getElementById('loadingSection');
            const successSection = document.getElementById('successSection');
            const questionText = document.getElementById('questionTitle').innerText;

            // สลับหน้าจอเป็นกำลังส่ง
            quizSection.style.display = 'none';
            loadingSection.style.display = 'block';

            try {
                const response = await fetch(FORMSPREE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        คำถาม: questionText,
                        คำตอบที่เลือก: answer,
                        เวลาที่ตอบ: new Date().toLocaleString('th-TH')
                    })
                });

                if (response.ok) {
                    playClickSound('success');
                    loadingSection.style.display = 'none';
                    document.getElementById('chosenText').innerText = `คำตอบ: ${answer}`;
                    successSection.style.display = 'block';
                } else {
                    alert("เกิดข้อผิดพลาดในการส่ง ลองกดใหม่อีกครั้งนะ");
                    loadingSection.style.display = 'none';
                    quizSection.style.display = 'block';
                }
            } catch (error) {
                alert("เชื่อมต่ออินเทอร์เน็ตไม่ได้ ลองใหม่อีกครั้ง");
                loadingSection.style.display = 'none';
                quizSection.style.display = 'block';
            }
        }
    </script>
</body>
</html>
