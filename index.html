<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำถามวัดใจ</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0d0d12;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: #171721;
      border: 3px solid #2e2e3e;
      border-radius: 20px;
      padding: 35px 25px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }

    .question-box {
      background-color: #222230;
      border: 2px dashed #4a4a68;
      border-radius: 14px;
      padding: 20px 15px;
      margin-bottom: 25px;
    }

    .question-text {
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0;
      line-height: 1.4;
      color: #00f5d4;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #0d0d12;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-1 {
      background-color: #00f5d4;
      box-shadow: 0 5px 0 #00a892;
    }

    .btn-2 {
      background-color: #ff477e;
      color: #ffffff;
      box-shadow: 0 5px 0 #b81d4a;
    }

    .btn-3 {
      background-color: #fee440;
      box-shadow: 0 5px 0 #b5a019;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      margin-top: 20px;
      font-size: 1rem;
      color: #a0a0b8;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="question-box">
      <!-- แก้ไขข้อความคำถามตรงบรรทัดด้านล่างนี้ได้เลย -->
      <h1 class="question-text" id="question">[ขอเลียหีหน่อยได้มั้ยย]</h1>
    </div>

    <div class="choices">
      <button class="btn btn-1" onclick="sendAnswer('ได้')">ได้</button>
      <button class="btn btn-2" onclick="sendAnswer('ไม่เอาา')">ไม่เอาา</button>
      <button class="btn btn-3" onclick="sendAnswer('มาาา')">มาาา</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // เสียงกดปุ่มแบบกวนๆ ด้วย Web Audio API (ไม่ต้องใช้ไฟล์เสียงเพิ่ม)
    function playBeep(freq) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function sendAnswer(choice) {
      const statusEl = document.getElementById('status');
      const questionText = document.getElementById('question').innerText;
      const buttons = document.querySelectorAll('.btn');

      // เล่นเสียงตามปุ่มที่กด
      if (choice === 'ได้') playBeep(520);
      else if (choice === 'ไม่เอาา') playBeep(240);
      else playBeep(680);

      // ปิดปุ่มกันกดซ้ำ
      buttons.forEach(btn => btn.disabled = true);
      statusEl.innerText = 'กำลังส่งคำตอบ...';

      // สร้างฟอร์มจำลองแล้วส่งข้อมูลไปที่ Formspree
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = 'https://formspree.io/f/mqpqpjez';

      const qInput = document.createElement('input');
      qInput.type = 'hidden';
      qInput.name = 'คำถาม';
      qInput.value = questionText;

      const aInput = document.createElement('input');
      aInput.type = 'hidden';
      aInput.name = 'คำตอบที่เลือก';
      aInput.value = choice;

      form.appendChild(qInput);
      form.appendChild(aInput);
      document.body.appendChild(form);
      form.submit();
    }
  </script>

</body>
</html>
