<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำถามโง่ๆ 1 ข้อ</title>
    <style>
        body {
            background-color: #ffff00; /* เหลืองแสบตา */
            color: #000000;
            font-family: "Comic Sans MS", "Tahoma", sans-serif;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
        }
        .box {
            background-color: #ffffff;
            border: 5px dashed #ff0000; /* เส้นประสีแดง */
            max-width: 450px;
            margin: 20px auto;
            padding: 25px;
            box-shadow: 10px 10px 0px #0000ff; /* เงาสีน้ำเงินทื่อๆ */
        }
        h1 {
            color: #ff0000;
            font-size: 26px;
            text-decoration: underline;
            margin-top: 0;
        }
        .question-text {
            font-size: 22px;
            font-weight: bold;
            background-color: #00ff00; /* เขียวสะท้อนแสง */
            padding: 15px;
            border: 3px solid #000000;
            margin-bottom: 25px;
            word-wrap: break-word;
        }
        .btn-choice {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            font-size: 20px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border: 4px solid #000000;
            background-color: #e0e0e0;
            color: #000000;
        }
        .btn-choice:hover {
            background-color: #ff9900;
        }
        .btn-choice:active {
            transform: translate(3px, 3px);
        }
        .copy-box {
            margin-top: 30px;
        }
        .btn-copy {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ff0000;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>ตอบมาซะดีๆ</h1>
        
        <!-- แก้ข้อความคำถามตรงบรรทัดด้านล่างนี้ได้เลย -->
        <div class="question-text" id="qText">
            [ใส่คำถามเองตรงนี้]
        </div>

        <!-- ฟอร์มส่งข้อมูลไปที่ Formspree -->
        <form action="https://formspree.io/f/mqpqpjez" method="POST">
            <!-- เก็บข้อความคำถามส่งไปด้วย จะได้รู้ว่าตอบคำถามไหน -->
            <input type="hidden" name="คำถาม" id="hiddenQuestion">

            <button type="submit" name="คำตอบที่เลือก" value="ได้" class="btn-choice">
                ได้
            </button>

            <button type="submit" name="คำตอบที่เลือก" value="ไม่เอาา" class="btn-choice">
                ไม่เอาา
            </button>

            <button type="submit" name="คำตอบที่เลือก" value="มาาา" class="btn-choice">
                มาาา
            </button>
        </form>
    </div>

    <div class="copy-box">
        <button class="btn-copy" onclick="copyCode()">คัดลอกโค้ดหน้านี้</button>
    </div>

    <script>
        // ดึงข้อความคำถามไปใส่ใน input ที่ซ่อนไว้ เพื่อส่งเข้า Formspree อัตโนมัติ
        document.getElementById('hiddenQuestion').value = document.getElementById('qText').innerText.trim();

        // ฟังก์ชันคัดลอกโค้ดทั้งหมด
        function copyCode() {
            const fullHtml = document.documentElement.outerHTML;
            navigator.clipboard.writeText("<!DOCTYPE html>\n" + fullHtml).then(() => {
                alert("คัดลอกโค้ดเรียบร้อย!");
            }).catch(() => {
                alert("คัดลอกไม่สำเร็จ กดค้างแล้วคัดลอกเอาเองนะ");
            });
        }
    </script>

</body>
</html>
